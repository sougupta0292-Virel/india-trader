name: Paper Trading Bot

on:
  schedule:
    # Every 15 min, UTC 3:30–10:00 (= IST 9:00–15:30), Mon–Fri
    # Script itself checks is_market_open() so pre/post runs are no-ops
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:   # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper trading scan
        run: python run_paper_trades.py

      - name: Commit updated paper trade state
        run: |
          git config user.name  "Paper Trade Bot"
          git config user.email "bot@india-trader"
          git add data/paper_trades.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "paper: $(date -u +'%Y-%m-%d %H:%M UTC')" && git push
